spring:
  profiles:
    active: local 
  application:
    name: ifconecta

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate 
    properties:
        "[hibernate.format_sql]": true

  flyway:
    enabled: true
    baseline-on-migrate: true

api:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 86400000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  web:
    base-url: ${APP_WEB_BASE_URL:http://localhost:8080}
