<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFConecta - Entrar</title>
    <link rel="icon" type="image/png" href="assets/if.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="main-content">
        <div class="form-card">
            <div class="form-header">
                <img src="assets/if.png" alt="Logo IFSP" class="inst-logo">
                <div>
                    <h2>Entrar no IFConecta</h2>
                    <p class="form-subtitle">Acesse com seu e-mail acadêmico</p>
                </div>
            </div>

            <form id="form-login" novalidate>
                <div class="form-group">
                    <label for="email">E-mail acadêmico</label>
                    <input type="email" id="email" name="email" placeholder="seu.nome@aluno.ifsp.edu.br" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Sua senha" autocomplete="current-password" required>
                </div>

                <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

                <div class="form-footer">
                    <button type="submit" class="submit-btn submit-btn--block" id="btn-submit">Entrar</button>
                </div>
            </form>

            <p class="form-switch">
                Ainda não tem conta?
                <a href="/cadastro/Cadastro.html">Cadastre-se</a>
            </p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
